<!DOCTYPE html>

<head>

<style>
  :root{
    --navy-deep:#0F1E3D;
    --navy:#1B3B7A;
    --gold:#C89B3C;
    --gold-light:#E7C978;
    --ink-soft:#4B5670;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter',sans-serif;
    background:linear-gradient(160deg, var(--navy-deep), var(--navy));
    color:#fff;
    padding:24px;
  }
  .card{
    max-width:520px;
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:18px;
    padding:52px 40px;
    text-align:center;
  }
  .icon{
    width:68px; height:68px; border-radius:50%;
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 22px;
    font-size:2rem;
    color:var(--navy-deep);
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-bottom:12px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-size:1.65rem;
    margin:0 0 18px;
    line-height:1.3;
  }
  .checklist{
    list-style:none;
    padding:0;
    margin:0 0 30px;
    text-align:left;
    display:inline-block;
  }
  .checklist li{
    color:rgba(255,255,255,0.85);
    font-size:0.98rem;
    margin-bottom:12px;
    line-height:1.5;
  }
  .btn-row{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:8px;
  }
  a.btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    font-weight:600;
    padding:14px 28px;
    border-radius:10px;
    font-size:0.95rem;
    transition:transform .2s ease;
  }
  a.btn:hover{ transform:translateY(-2px); }
  .btn-gold{
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    color:var(--navy-deep);
  }
  .btn-whatsapp{
    background:#25D366;
    color:#fff;
  }
</style>
